<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TROY — Rise of the Bronze City</title>
<style>
/* ============ TROY v1 — bronze / marble / deep-red theme ============ */
:root{
  --bronze:#b08d57; --bronze-d:#8a6d3f; --bronze-l:#d9bd85;
  --marble:#f6f1e3; --marble-d:#e9dfc6; --marble-dd:#d9cba6;
  --red:#7a1f1f; --red-d:#571111; --red-l:#a83a3a;
  --ink:#2c2317; --ink-l:#5a4a33; --gold:#d9a441;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#14100a;font-family:Georgia,'Times New Roman',serif;color:var(--ink);
  display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;min-height:100vh;background:var(--marble);
  background-image:repeating-linear-gradient(45deg,rgba(176,141,87,.04) 0 2px,transparent 2px 6px);
  display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px #000}
/* ---------- header resource bar ---------- */
#resbar{background:linear-gradient(180deg,#3a2a18,#241a0e);color:var(--marble);
  padding:8px 6px 6px;border-bottom:3px solid var(--bronze);position:sticky;top:0;z-index:30}
#resbar .title{text-align:center;font-size:15px;letter-spacing:4px;color:var(--bronze-l);
  font-weight:bold;margin-bottom:6px;text-shadow:0 1px 0 #000}
#resgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.res-chip{background:rgba(246,241,227,.08);border:1px solid var(--bronze-d);border-radius:8px;
  padding:4px 6px;text-align:center;min-width:0}
.res-chip .r-top{display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:14px;font-weight:bold;color:#fff;white-space:nowrap}
.res-chip .r-rate{font-size:10px;color:var(--bronze-l);font-family:Arial,sans-serif}
.ic{display:inline-flex;vertical-align:middle}
.ic svg{width:1.15em;height:1.15em;vertical-align:-0.2em}
/* ---------- hint bar ---------- */
#hintbar{background:linear-gradient(90deg,var(--red),var(--red-d));color:#ffe9c9;
  font-size:13px;padding:7px 12px;display:flex;gap:8px;align-items:center;z-index:29}
#hintbar .pulse{animation:pulse 1.6s infinite;font-size:15px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ---------- views ---------- */
#views{flex:1;padding:10px 10px 86px;overflow-y:auto}
.view{display:none}
.view.active{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:16px;letter-spacing:2px;color:var(--red-d);border-bottom:2px solid var(--bronze);
  padding-bottom:4px;margin:12px 2px 8px;text-transform:uppercase}
/* ---------- cards & buttons ---------- */
.card{background:linear-gradient(180deg,#fffdf6,var(--marble-d));border:2px solid var(--bronze);
  border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 2px 6px rgba(60,40,10,.25)}
.btn{display:inline-block;background:linear-gradient(180deg,var(--bronze-l),var(--bronze));
  border:2px solid var(--bronze-d);border-radius:8px;color:#2c1f0e;font-weight:bold;
  font-family:Georgia,serif;font-size:14px;padding:10px 16px;cursor:pointer;min-height:44px;
  text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.red{background:linear-gradient(180deg,var(--red-l),var(--red));border-color:var(--red-d);color:#ffe9c9;text-shadow:0 1px 0 #000}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{font-size:12px;padding:6px 10px;min-height:36px}
.lvl-pips{letter-spacing:2px;font-size:13px;color:var(--bronze-d)}
.lvl-pips .on{color:var(--gold);text-shadow:0 0 2px var(--bronze-d)}
.costline{font-size:12px;color:var(--ink-l);font-family:Arial,sans-serif;margin:4px 0}
.prog{height:10px;background:#cbbd97;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--bronze-d)}
.prog > div{height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold));width:0%}
.prog.red > div{background:linear-gradient(90deg,var(--red-l),var(--red))}
.bld-head{display:flex;align-items:center;gap:10px}
.bld-icon{width:46px;height:46px;flex:0 0 46px;background:radial-gradient(circle at 35% 30%,#fff8e6,var(--marble-d));
  border:2px solid var(--bronze);border-radius:10px;display:flex;align-items:center;justify-content:center}
.bld-icon .ic svg{width:28px;height:28px}
.bld-name{font-size:16px;font-weight:bold;color:var(--red-d)}
.bld-desc{font-size:12px;color:var(--ink-l);font-style:italic}
/* ---------- tab bar ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#3a2a18,#1d1409);
  border-top:3px solid var(--bronze);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{background:none;border:none;color:#cbbd97;font-family:Georgia,serif;font-size:11px;
  padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
.tabbtn .ic svg{width:24px;height:24px}
.tabbtn.active{color:var(--gold)}
.tabbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--red-l);display:none}
.tabbtn .dot.show{display:block}
/* ---------- map ---------- */
#mapwrap{position:relative;width:100%;height:480px;border:3px solid var(--bronze-d);border-radius:12px;
  overflow:hidden;background:#e6d9b8;box-shadow:inset 0 0 40px rgba(122,31,31,.15)}
#mapbg{position:absolute;inset:0;width:100%;height:100%}
.mnode{position:absolute;transform:translate(-50%,-50%);width:64px;display:flex;flex-direction:column;
  align-items:center;cursor:pointer;background:none;border:none;font-family:Georgia,serif;padding:0}
.mnode .mn-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--bronze-d);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mnode .mn-ic .ic svg{width:24px;height:24px}
.mnode .mn-lb{font-size:9.5px;color:#fff;background:rgba(20,12,6,.78);border-radius:6px;
  padding:2px 5px;margin-top:3px;text-align:center;line-height:1.15;max-width:76px}
.mnode .mn-tier{position:absolute;top:-4px;right:6px;background:var(--red);color:#ffe9c9;font-size:10px;
  font-weight:bold;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  border:1px solid #ffe9c9;font-family:Arial,sans-serif}
.mnode.gather .mn-ic{background:radial-gradient(circle at 35% 30%,#fdf6df,#c9a86a)}
.mnode.camp .mn-ic{background:radial-gradient(circle at 35% 30%,#e8a0a0,#7a1f1f)}
.mnode.camp .mn-ic .ic{color:#ffe9c9}
.mnode.city .mn-ic{background:radial-gradient(circle at 35% 30%,#c9b586,#6b5326);border-color:#3a2c12}
.mnode.city .mn-ic .ic{color:#ffe9c9}
.mnode.boss .mn-ic{background:radial-gradient(circle at 35% 30%,#5c1414,#1d0808);border-color:var(--gold);animation:pulse 2s infinite}
.mnode.boss .mn-ic .ic{color:var(--gold)}
.mnode.ruin .mn-ic{background:radial-gradient(circle at 35% 30%,#d8cfae,#8a7a55)}
.mnode.done{opacity:.45;filter:grayscale(.8)}
.mnode.done .mn-tier{display:none}
#home-marker{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#home-marker .troy{font-size:13px;font-weight:bold;letter-spacing:3px;color:var(--red-d);
  text-shadow:0 1px 0 #fff,0 0 6px #fff}
.marchbar{background:#2c1f0e;border:1px solid var(--bronze);border-radius:8px;color:#ffe9c9;
  font-size:12px;font-family:Arial,sans-serif;padding:8px 10px;margin-bottom:8px}
/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;
  background:rgba(10,6,3,.72);padding:18px}
#modal-root.open{display:flex}
#modal{background:linear-gradient(180deg,#fffdf6,var(--marble-d));border:3px solid var(--bronze);
  border-radius:14px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:18px;
  box-shadow:0 8px 40px #000;animation:fadein .25s}
#modal h3{margin:0 0 8px;color:var(--red-d);letter-spacing:1px;font-size:18px}
#modal .flavor{font-style:italic;color:var(--ink-l);font-size:13px;margin-bottom:10px}
/* ---------- title screen ---------- */
#titlescreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#160d06;overflow:hidden}
#titlescreen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#titlescreen .ts-fallback{position:absolute;top:14%;width:100%;text-align:center;font-family:Georgia,serif;
  font-size:72px;letter-spacing:8px;color:#c9973f;text-shadow:0 3px 0 #5b3a12,0 6px 18px #000}
#titlescreen .ts-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,6,2,.88) 0%,rgba(12,6,2,0) 50%)}
#titlescreen .ts-content{position:absolute;bottom:7%;left:0;right:0;text-align:center}
#titlescreen .ts-sub{color:#e8d9b8;font-family:Georgia,serif;font-style:italic;font-size:15px;margin-bottom:14px;text-shadow:0 2px 6px #000}
.ts-enter{font-size:20px;padding:14px 46px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
/* ---------- toast ---------- */
#toast-root{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;
  z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{background:#241a0e;color:#ffe9c9;border:2px solid var(--bronze);border-radius:10px;
  padding:9px 14px;font-size:13px;font-family:Arial,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5);
  animation:fadein .25s;text-align:center;max-width:100%}
/* ---------- misc ---------- */
.stepper{display:flex;align-items:center;gap:10px;margin:8px 0}
.stepper button{width:44px;height:44px;font-size:20px;border-radius:10px;border:2px solid var(--bronze-d);
  background:linear-gradient(180deg,var(--bronze-l),var(--bronze));font-weight:bold;cursor:pointer;color:#2c1f0e}
.stepper .val{font-size:18px;font-weight:bold;min-width:52px;text-align:center;font-family:Arial,sans-serif}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bronze);color:#fff;font-weight:bold;
  display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;border:2px solid var(--bronze-d)}
.qrow.done .qnum{background:#6a8f3c;border-color:#4a6a28}
.qrow.locked{opacity:.5}
.xpbar{height:12px;background:#cbbd97;border:1px solid var(--bronze-d);border-radius:7px;overflow:hidden;margin:6px 0}
.xpbar > div{height:100%;background:linear-gradient(90deg,#6a8f3c,#9dc65c)}
.ability{border-left:4px solid var(--marble-dd);padding:6px 10px;margin:6px 0;background:rgba(255,255,255,.4);border-radius:0 8px 8px 0}
.ability.unlocked{border-left-color:var(--gold)}
.ability .an{font-weight:bold;color:var(--red-d)}
.ability .lock{color:var(--ink-l);font-size:12px;font-style:italic}
table.rep{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;margin:8px 0}
table.rep td,table.rep th{border:1px solid var(--bronze-d);padding:6px 8px;text-align:left}
table.rep th{background:var(--bronze);color:#2c1f0e}
.winbanner{text-align:center;font-size:22px;font-weight:bold;letter-spacing:2px;margin:6px 0}
.streak{display:flex;justify-content:center;gap:6px;margin:8px 0}
/* ---------- battle replay viewer ---------- */
.wr-field{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:stretch;margin:8px 0}
.wr-side{background:rgba(44,31,14,.06);border:2px solid var(--bronze-d);border-radius:10px;padding:8px 6px}
.wr-side.atk{border-color:var(--gold)}
.wr-name{font-size:12px;font-weight:bold;text-align:center;color:var(--red-d);margin-bottom:6px;
  font-family:Arial,sans-serif;min-height:30px;display:flex;align-items:center;justify-content:center}
.wr-row{display:flex;align-items:center;gap:6px;margin:6px 0;font-family:Arial,sans-serif}
.wr-row .ic svg{width:22px;height:22px;flex:0 0 22px}
.wr-count{font-weight:bold;font-size:14px;min-width:32px;text-align:right}
.wr-hp{flex:1;height:10px;background:#cbbd97;border:1px solid var(--bronze-d);border-radius:6px;overflow:hidden}
.wr-hp>div{height:100%;width:100%;background:linear-gradient(90deg,#a83a3a,#e07a5f);transition:width .3s}
.wr-side.def .wr-hp>div{background:linear-gradient(90deg,#b8860b,#e8c35a)}
.wr-mid{display:flex;align-items:center;justify-content:center}
#wr-clash{font-size:30px;line-height:1}
#wr-clash.hit{animation:wrclash .45s}
@keyframes wrclash{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.wr-side.flash{animation:wrflash .5s}
@keyframes wrflash{0%{background:rgba(168,58,58,.55)}100%{background:rgba(44,31,14,.06)}}
.wr-controls{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.wr-controls .btn{min-width:70px}
#wr-result{text-align:center;margin:8px 0;font-family:Arial,sans-serif}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--bronze-d);display:flex;
  align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:12px;
  font-weight:bold;color:var(--ink-l);background:var(--marble-d)}
.sdot.on{background:radial-gradient(circle at 35% 30%,var(--gold),var(--bronze-d));color:#2c1f0e}
.hero-portrait{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);
  background:radial-gradient(circle at 35% 30%,#a83a3a,#571111);display:flex;align-items:center;
  justify-content:center;margin:0 auto 8px}
.hero-portrait .ic svg{width:48px;height:48px;color:var(--gold)}
.center{text-align:center}
.small{font-size:12px;color:var(--ink-l);font-family:Arial,sans-serif}
#saveind{font-size:11px;color:var(--bronze);font-family:Arial,sans-serif;white-space:nowrap;align-self:center}
hr.bronze{border:none;border-top:2px solid var(--bronze);margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <header id="resbar">
    <div class="title">TROY</div>
    <div id="resgrid"></div>
    <div id="saveind" title="Your progress saves automatically on this device">● saving…</div>
  </header>
  <div id="hintbar"><span class="pulse">❖</span><span id="hinttext"></span></div>
  <main id="views">
    <section id="view-city" class="view"></section>
    <section id="view-map" class="view"></section>
    <section id="view-army" class="view"></section>
    <section id="view-hero" class="view"></section>
    <section id="view-quests" class="view"></section>
  </main>
  <nav id="tabbar"></nav>
  <div id="modal-root"><div id="modal"></div></div>
  <div id="titlescreen">
    <div class="ts-fallback">TROY</div>
    <img src="troy-cover.webp" alt="" onerror="this.style.display='none'">
    <div class="ts-shade"></div>
    <div class="ts-content">
      <div class="ts-sub">Build your city. Raise your army. Take the throne.</div>
      <button class="btn ts-enter" onclick="Game.enterTitle()">⚔ Enter Troy</button>
    </div>
  </div>
  <div id="toast-root"></div>
</div>
<script>
'use strict';
/* =====================================================================
   TROY v1 — single-player bronze-age city builder / strategy
   All state in `S`. Timers stored as absolute timestamps (ms) so
   offline progress works. Autosaves to localStorage key 'troySaveV1'.
   ===================================================================== */
/* ---------------- icons (inline SVG, no external assets) ---------------- */
const ICONS = {
  wheat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8"/><path d="M12 8C12 5 10 3 7 3c0 3 2 5 5 5z"/><path d="M12 8c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 14c-3 0-5-2-5-5 3 0 5 2 5 5z"/><path d="M12 14c3 0 5-2 5-5-3 0-5 2-5 5z"/></svg>',
  tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l6 9H6z"/><path d="M12 9l5 7H7z"/><path d="M12 16v5"/></svg>',
  mountain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-11 4 7 3-4 5 8z"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>',
  palace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6"/><path d="M5 9v10M9.5 9v10M14.5 9v10M19 9v10"/><path d="M3 21h18"/></svg>',
  barracks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L12 4l8 16"/><path d="M8 20l4-8 4 8"/></svg>',
  walls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V9l2-2v3h3V7h3v3h3V7h3v3h2V7l2 2v11"/><path d="M4 20h16"/></svg>',
  farm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M6 21V10l6-5 6 5v11"/><path d="M10 21v-6h4v6"/></svg>',
  spear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L17 7"/><path d="M17 7l-2-2 4-2-2 4z"/></svg>',
  bow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3c6 4 6 14 0 18"/><path d="M7 3v18"/><path d="M7 12h9"/><path d="M16 12l-3-2M16 12l-3 2"/></svg>',
  horse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20v-4a6 6 0 0 1 12 0v4"/><path d="M6 16H4M20 16h-2"/></svg>',
  hero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4"/><path d="M5 12a7 7 0 0 1 14 0v3H5z"/><path d="M12 3c-1 2-1 3 0 4 1-1 1-2 0-4z"/></svg>',
  scroll:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h11a3 3 0 0 1 3 3v11a2 2 0 0 1-4 0V7a1 1 0 0 0-1-1"/><path d="M6 4a2 2 0 0 0-2 2v12a2 2 0 0 0 4 0"/></svg>',
  fire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c2 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-4 2-5 .5 1.5 1.5 2 2.5 2C11 8 11 5 12 3z"/></svg>',
  city:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V10l3-2v4h2V6l3-2 3 2v6h2V8l3 2v11"/><path d="M3 21h18"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="7"/><path d="M9 21v-3M15 21v-3"/><circle cx="9.5" cy="10" r="1" fill="currentColor"/><circle cx="14.5" cy="10" r="1" fill="currentColor"/></svg>',
  ruin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16"/><path d="M6 20v-8l4-4 4 4v8"/><path d="M14 20v-5h4v5"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
  sword:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6"/><path d="M14 4l6 6"/><path d="M4 20l3-3"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 13l5 5L20 7"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.1-5.6-3.2-5.6 3.2 1.2-6.1L3 9.6l6.3-.8z"/></svg>'
};
function icon(n){ return '<span class="ic">'+ICONS[n]+'</span>'; }

/* ---------------- static game data ---------------- */
const RES = ['food','wood','stone','gold'];
const RES_ICON = {food:'wheat', wood:'tree', stone:'mountain', gold:'coin'};

function defaultState(){
  return {
    v:1, createdAt:Date.now(), lastSeen:Date.now(),
    res:{food:600, wood:600, stone:400, gold:300},
    bld:{palace:1, farm:0, lumber:0, quarry:0, barracks:0, walls:0},
    build:null,               // {key, toLevel, doneAt}
    tqueue:[],                // [{type, left, unitDoneAt, unitTime}]
    troops:{spearman:0, archer:0, cavalry:0},
    player:{level:1, xp:0},
    hero:{xp:0, away:false},
    quests:{},                // id -> true when claimed
    nodes:{},                 // id -> {cleared:true}
    marches:[],               // {id, nodeId, troops, hero, phase, arriveAt, gatherAt, returnAt, marchSecs}
    stats:{trained:0, battles:0, wins:0, gathers:0, raidsRepelled:0},
    raidsOn:false, nextRaidAt:0, raidWarnAt:0, raidWarned:false, shieldUntil:0,
    daily:{lastDay:'', streak:0},
    victory:false, victoryShown:false,
    seenWelcome:false,
    marchSeq:1
  };
}

function save(){
  if(!S) return;
  S.lastSeen = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
  const el = document.getElementById('saveind');
  if(el){
    const t = new Date(S.lastSeen);
    let h = t.getHours(), ap = h>=12?'PM':'AM';
    h = h%12 || 12;
    el.textContent = '\u2713 Saved ' + h + ':' + String(t.getMinutes()).padStart(2,'0') + ' ' + ap;
  }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.v!==1) return null;
    // forward-compat: fill any missing fields
    const d = defaultState();
    for(const k of Object.keys(d)) if(s[k]===undefined) s[k]=d[k];
    if(!s.player) s.player = {level:1, xp:0};
    return s;
  }catch(e){ return null; }
}

/* ---------------- helpers ---------------- */
const $ = sel=>document.querySelector(sel);
const nowMs = ()=>Date.now();
function fmtT(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0');
}
function fmtN(n){ return Math.floor(n).toLocaleString('en-US'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function heroLevel(){ let lvl=1, xp=S.hero.xp; while(lvl<HERO.maxLevel && xp>=heroXpNeed(lvl)){ xp-=heroXpNeed(lvl); lvl++; } return lvl; }
function troopCount(t){ return Math.floor(S.troops[t]||0); }
function armyTotal(troopsObj){
  const o = troopsObj||S.troops;
  return TROOP_ORDER.reduce((s,t)=>s+Math.floor(o[t]||0),0);
}

/* ---------------- player level ---------------- */
function addPlayerXP(n){
  if(S.player.level>=PLAYER_MAX_LEVEL){ S.player.xp=0; return; }
  S.player.xp += n;
  while(S.player.level<PLAYER_MAX_LEVEL && S.player.xp>=playerXpNeed(S.player.level)){
    S.player.xp -= playerXpNeed(S.player.level);
    S.player.level++;
    toast('❖ Player level up! You are now Lv '+S.player.level+' (+2% production, +2% attack)');
  }
  if(S.player.level>=PLAYER_MAX_LEVEL) S.player.xp=0;
}

/* ---------------- economy ---------------- */
function storageCap(){ return 2000 + 1000*(S.bld.palace||1); }
function prodRates(){ // per hour, before player bonus
  return {
    food: 60*(S.bld.farm||0),
    wood: 60*(S.bld.lumber||0),
    stone:60*(S.bld.quarry||0),
    gold: 40*(S.bld.palace||0)
  };
}
function grantRes(res, silent){
  const cap = storageCap();
  for(const k of RES){
    if(res[k]) S.res[k] = Math.min(cap, S.res[k]+res[k]);
  }
  if(!silent) save();
}
function produce(dtSec){
  const rates = prodRates(), mult = playerProdMult(), cap = storageCap();
  for(const k of RES){
    S.res[k] = Math.min(cap, S.res[k] + rates[k]*mult*dtSec/3600);
  }
}
function buildCost(key, toLevel){
  const base = BUILDINGS[key].base, out = {};
  const f = Math.pow(COST_SCALE, toLevel-1);
  for(const k in base) out[k] = Math.ceil(base[k]*f);
  return out;
}
function canAfford(cost){
  for(const k in cost) if(S.res[k] < cost[k]) return false;
  return true;
}
function pay(cost){
  for(const k in cost) S.res[k] -= cost[k];
}
function costText(cost){
  return Object.keys(cost).map(k=>icon(RES_ICON[k])+' '+fmtN(cost[k])).join(' &nbsp; ');
}

/* ---------------- building ---------------- */
function startBuild(key){
  if(S.build){ toast('Builders are already busy.'); return; }
  const lvl = S.bld[key]||0;
  if(lvl>=5){ toast('Already at max level.'); return; }
  const toLevel = lvl+1;
  const cost = buildCost(key, toLevel);
  if(!canAfford(cost)){ toast('Not enough resources.'); return; }
  pay(cost);
  S.build = {key:key, toLevel:toLevel, doneAt:nowMs()+BUILD_TIME[toLevel-1]*1000};
  toast(BUILDINGS[key].name+' → Lv '+toLevel+' started.');
  save(); render();
}
function completeBuild(){
  const b = S.build;
  S.bld[b.key] = b.toLevel;
  S.build = null;
  addPlayerXP(XP_BUILD);
  toast(BUILDINGS[b.key].name+' reached level '+b.toLevel+'! (+'+XP_BUILD+' XP)');
  checkQuests();
  save();
}

/* ---------------- training ---------------- */
function trainTime(type){
  const lvl = S.bld.barracks||1;
  return TROOPS[type].time * (1 - 0.08*(lvl-1)); // higher barracks = faster
}
function queueTrain(type, count){
  if((S.bld.barracks||0) < TROOPS[type].need){ toast('Requires Barracks Lv '+TROOPS[type].need+'.'); return; }
  count = Math.max(1, Math.min(50, Math.floor(count)||1));
  const cost = {};
  for(const k in TROOPS[type].cost) cost[k] = TROOPS[type].cost[k]*count;
  if(!canAfford(cost)){ toast('Not enough resources to train '+count+'.'); return; }
  pay(cost);
  const ut = trainTime(type);
  const first = S.tqueue.length===0;
  S.tqueue.push({type:type, left:count, unitTime:ut, unitDoneAt:nowMs()+(first?ut*1000:0)});
  // fix chaining: each batch starts when previous ends
  let t = nowMs();
  for(const b of S.tqueue){
    if(b.left>0 && b.unitDoneAt < t) b.unitDoneAt = t + b.unitTime*1000;
    t = b.unitDoneAt + (b.left-1)*b.unitTime*1000;
  }
  toast('Training '+count+' '+TROOPS[type].name+(count>1?'s':'')+'.');
  save(); render();
}
function tickTraining(){
  let changed = false;
  while(S.tqueue.length>0){
    const b = S.tqueue[0];
    if(nowMs() < b.unitDoneAt) break;
    b.left--; b.unitDoneAt += b.unitTime*1000;
    S.troops[b.type] = (S.troops[b.type]||0)+1;
    S.stats.trained++;
    addPlayerXP(XP_TRAIN);
    changed = true;
    if(b.left<=0) S.tqueue.shift();
    if(S.tqueue.length>0 && S.tqueue[0].unitDoneAt < nowMs()){
      // next batch starts now if its timer was never anchored
      S.tqueue[0].unitDoneAt = Math.max(S.tqueue[0].unitDoneAt, nowMs());
    }
  }
  if(changed){ checkQuests(); save(); }
  return changed;
}
function queueEta(){
  let t = 0;
  for(const b of S.tqueue) t += b.left*b.unitTime;
  return t;
}

/* ---------------- battles ----------------
   Auto-resolved in rounds. Each round both sides deal damage simultaneously
   from surviving units; damage is mitigated by the target's total DEF.
   Counter matchups grant 1.5x attack. Player side gets +2%/player-level
   attack, plus hero bonuses (War Horn) and loss reduction (Shield Wall). */
function simBattle(atk, atkHeroLvl, def, defHeroLvl, opts){
  opts = opts||{};
  const A={}, D={};
  for(const t of TROOP_ORDER){ A[t]=Math.max(0,Math.floor((atk[t]||0))); D[t]=Math.max(0,Math.floor((def[t]||0))); }
  const sum = o=>TROOP_ORDER.reduce((s,t)=>s+o[t],0);
  const hpOf = o=>TROOP_ORDER.reduce((s,t)=>s+o[t]*TROOPS[t].hp,0);
  const majority = o=>{ let m=TROOP_ORDER[0]; for(const t of TROOP_ORDER) if(o[t]>o[m]) m=t; return m; };
  const mA = majority(A), mD = majority(D);
  const mult = (t, vsMaj)=> (TROOPS[t].strongVs===vsMaj) ? 1.5 : 1;
  const atkMult = (atkHeroLvl>0 ? playerAtkMult() : 1) * (atkHeroLvl>=4 ? heroAtkBonus(atkHeroLvl) : 1) * (opts.atkDmgMult||1);
  const defMult = (defHeroLvl>0 ? playerAtkMult() : 1) * (defHeroLvl>=4 ? heroAtkBonus(defHeroLvl) : 1) * (opts.defAtkMult||1);
  const atkLossRed = atkHeroLvl>=2 ? heroLossRed(atkHeroLvl) : 1;
  const defLossRed = defHeroLvl>=2 ? heroLossRed(defHeroLvl) : 1;
  const A0={...A}, D0={...D};
  // Replay frames: raw float snapshots (round 0 = initial, then after each round).
  // Kept unrounded so Math.floor() of the final frame matches atkLeft/defLeft exactly.
  const snap=()=>({a:{spearman:A.spearman,archer:A.archer,cavalry:A.cavalry},
                   d:{spearman:D.spearman,archer:D.archer,cavalry:D.cavalry},
                   hpA:hpOf(A),hpD:hpOf(D)});
  const frames=[snap()];
  let rounds=0;
  while(rounds<50){
    if(sum(A)<=0 || sum(D)<=0) break;
    const pA = TROOP_ORDER.reduce((s,t)=>s+A[t]*TROOPS[t].atk*mult(t,mD),0)*atkMult;
    const pD = TROOP_ORDER.reduce((s,t)=>s+D[t]*TROOPS[t].atk*mult(t,mA),0)*defMult;
    const dA = TROOP_ORDER.reduce((s,t)=>s+A[t]*TROOPS[t].def,0);
    const dD = TROOP_ORDER.reduce((s,t)=>s+D[t]*TROOPS[t].def,0);
    const mitA = 1-Math.min(0.6, dA/(dA+500));
    const mitD = 1-Math.min(0.6, dD/(dD+500));
    const hA = hpOf(A), hD = hpOf(D);
    const fA = hA>0 ? Math.max(0, 1-(pD*mitA*atkLossRed)/hA) : 0;
    const fD = hD>0 ? Math.max(0, 1-(pA*mitD*defLossRed)/hD) : 0;
    for(const t of TROOP_ORDER){ A[t]*=fA; D[t]*=fD; }
    frames.push(snap());
    rounds++;
  }
  const hpAFrac = hpOf(A0)>0 ? hpOf(A)/hpOf(A0) : 0;
  const hpDFrac = hpOf(D0)>0 ? hpOf(D)/hpOf(D0) : 0;
  const win = (sum(A)>0 && sum(D)<=0) || (sum(A)>0 && sum(D)>0 && hpAFrac>=hpDFrac) ? 'atk'
            : (sum(D)>0 && sum(A)<=0) || hpDFrac>hpAFrac ? 'def' : 'atk';
  const losses = (o0,o1)=>{ const r={}; for(const t of TROOP_ORDER) r[t]=Math.max(0,Math.floor(o0[t]-o1[t])); return r; };
  const atkLost = losses(A0,A), defLost = losses(D0,D);
  const killed = TROOP_ORDER.reduce((s,t)=>s+defLost[t],0);
  return {win:win, rounds:rounds, atkLost:atkLost, defLost:defLost,
          atkLeft:{spearman:Math.floor(A.spearman), archer:Math.floor(A.archer), cavalry:Math.floor(A.cavalry)},
          defLeft:{spearman:Math.floor(D.spearman), archer:Math.floor(D.archer), cavalry:Math.floor(D.cavalry)},
          xp: 12*killed, replay:frames};
}

/* ---------------- marches ---------------- */
function activeMarches(){ return S.marches.length; }
function heroHome(){ return !S.hero.away; }

function sendMarch(nodeId, troops, withHero){
  const node = NODE_BY_ID[nodeId];
  if(!node) return;
  if(S.marches.length>=2){ toast('Only 2 marches at once in this version.'); return; }
  const total = TROOP_ORDER.reduce((s,t)=>s+(troops[t]||0),0);
  if(total<=0){ toast('Select at least one troop.'); return; }
  for(const t of TROOP_ORDER){
    if((troops[t]||0) > troopCount(t)){ toast('Not enough '+TROOPS[t].name+'s.'); return; }
  }
  if(withHero && !heroHome()){ toast('Theron is already on a march.'); return; }
  if(node.kind!=='gather' && S.nodes[nodeId] && S.nodes[nodeId].cleared){ toast('Already conquered.'); return; }
  // commit troops
  for(const t of TROOP_ORDER) S.troops[t] -= (troops[t]||0);
  if(withHero) S.hero.away = true;
  let secs = node.march;
  if(withHero) secs = Math.round(secs * heroMarchMult(heroLevel()));
  const t = nowMs();
  S.marches.push({id:S.marchSeq++, nodeId:nodeId,
    troops:{spearman:troops.spearman||0, archer:troops.archer||0, cavalry:troops.cavalry||0},
    hero:!!withHero, phase:'out', arriveAt:t+secs*1000, gatherAt:0, returnAt:0, marchSecs:secs});
  closeModal();
  toast('Marching to '+node.name+' ('+fmtT(secs)+').');
  save(); render();
}

function resolveAttackMarch(m, silent){
  const node = NODE_BY_ID[m.nodeId];
  const heroLvl = m.hero ? heroLevel() : 0;
  const r = simBattle(m.troops, heroLvl, node.garrison, 0, {defAtkMult:node.wallMult||1});
  S.stats.battles++;
  const won = r.win==='atk';
  let lootGranted = {};
  const heroXpGain = m.hero ? (won ? r.xp : Math.floor(r.xp/3)) : 0;
  if(m.hero) S.hero.xp += heroXpGain;
  if(won){
    S.stats.wins++;
    lootGranted = {...(node.loot||{})};
    grantRes(lootGranted, true);
    S.nodes[m.nodeId] = {cleared:true};
    addPlayerXP(XP_BATTLE_WIN);
    if(node.kind==='boss'){
      S.victory = true;
    }
  }
  // survivors return home
  m.phase='back'; m.returnAt = nowMs()+m.marchSecs*1000;
  m.survivors = r.atkLeft;
  m.result = {won:won, report:r, nodeName:node.name, loot:lootGranted, heroXp:heroXpGain};
  checkQuests();
  return m.result;
}

function tickMarches(silent){
  let changed=false, reports=[];
  for(const m of S.marches){
    const node = NODE_BY_ID[m.nodeId];
    if(m.phase==='out' && nowMs()>=m.arriveAt){
      if(node.kind==='gather'){
        m.phase='gather'; m.gatherAt = nowMs()+GATHER_TIME*1000;
      } else {
        const res = resolveAttackMarch(m, silent);
        reports.push(res);
      }
      changed=true;
    } else if(m.phase==='gather' && nowMs()>=m.gatherAt){
      const n = armyTotal(m.troops);
      m.cargo = {}; m.cargo[node.res] = n*GATHER_YIELD;
      S.stats.gathers++;
      addPlayerXP(XP_GATHER);
      m.phase='back'; m.returnAt = nowMs()+m.marchSecs*1000;
      changed=true;
    } else if(m.phase==='back' && nowMs()>=m.returnAt){
      // deliver survivors + cargo
      const sv = m.survivors||m.troops;
      for(const t of TROOP_ORDER) S.troops[t]=(S.troops[t]||0)+Math.floor(sv[t]||0);
      if(m.cargo) grantRes(m.cargo, true);
      if(m.hero) S.hero.away=false;
      m.done=true; changed=true;
      // battle reports were already shown at resolve time; only toast gather returns here
      if(m.cargo && !silent) toast('Gatherers returned: +'+fmtN(m.cargo[node.res])+' '+RES_NAME[node.res]+' (+'+XP_GATHER+' XP)');
      checkQuests();
    }
  }
  const before = S.marches.length;
  S.marches = S.marches.filter(m=>!m.done);
  if(S.marches.length!==before) changed=true;
  if(changed) save();
  return reports;
}

/* ---------------- raids (defend the city) ---------------- */
function armyPower(troopsObj){
  const o = troopsObj||S.troops;
  return TROOP_ORDER.reduce((s,t)=>s+Math.floor(o[t]||0)*(TROOPS[t].atk+TROOPS[t].def),0);
}
// First warband strikes ~10 min after raids unlock; afterwards every 20-40 min
// (randomized). A 2-minute warning precedes each raid so the player can garrison troops.
function scheduleNextRaid(fromMs, first){
  const mins = first ? 10 : 20 + Math.random()*20;
  S.nextRaidAt = fromMs + mins*60*1000;
  S.raidWarnAt = S.nextRaidAt - 2*60*1000;
  S.raidWarned = false;
}

// Walls contribute militia: folded into the spearman count at 0.75 power each.
function raidDefenseWithMilitia(){
  // returns {def, note} — militia folded into spearman count at 0.75 power each
  const m = (S.bld.walls||0)*10;
  return {spearman:troopCount('spearman')+Math.round(m*0.75), archer:troopCount('archer'), cavalry:troopCount('cavalry'), militia:m};
}
function tickRaid(silent){
  if(!S.raidsOn) return null;
  if(!S.raidWarnAt) S.raidWarnAt = S.nextRaidAt - 2*60*1000;   // normalize old saves
  const now = nowMs();
  if(S.shieldUntil && now < S.shieldUntil){
    // Beginner shield: park the raid clock until the shield drops.
    if(S.nextRaidAt && S.nextRaidAt < now) scheduleNextRaid(S.shieldUntil, false);
    return null;
  }
  // Warning phase: ~2 min heads-up in live sessions (offline raids resolve silently).
  if(!silent && !S.raidWarned && now>=S.raidWarnAt && now<S.nextRaidAt){
    S.raidWarned = true; save();
    toast('⚠ Warband approaching! Raiders strike Troy in ~2 minutes — keep troops garrisoned!');
    return {warn:true};
  }
  if(now < S.nextRaidAt) return null;
  const def = raidDefenseWithMilitia();
  const realDef = {spearman:troopCount('spearman'), archer:troopCount('archer'), cavalry:troopCount('cavalry')};
  const totalTroops = armyTotal();
  const jitter = silent ? 1 : (0.85+Math.random()*0.3);
  // Warband strength scales with player level + garrison size: beatable if you
  // prepare (troops home, Walls raised), costly if you don't.
  const raidN = Math.max(5, Math.round((2 + S.player.level + totalTroops*0.3) * jitter));
  const raid = {spearman:raidN, archer:0, cavalry:0};
  const defHeroLvl = heroHome() ? heroLevel() : 0;
  // Walls blunt the assault: each Walls level = -6% attacker damage.
  const wallDmgMult = Math.max(0.4, 1 - 0.06*(S.bld.walls||0));
  const r = simBattle(raid, 0, def, defHeroLvl, {atkDmgMult:wallDmgMult});
  S.stats.battles++;
  // scale militia-inflated losses back to real troops proportionally
  const militia = def.militia||0;
  const realTotal = Math.max(1, armyTotal(realDef));
  const shownTotal = Math.max(1, armyTotal(def));
  for(const t of TROOP_ORDER){
    const scaledLoss = Math.round(r.defLost[t]*(realTotal/shownTotal));
    S.troops[t] = Math.max(0, (S.troops[t]||0)-scaledLoss);
  }
  let msg;
  if(r.win==='def'){
    S.stats.wins++; S.stats.raidsRepelled++;
    grantRes({gold:50}, true);
    addPlayerXP(XP_BATTLE_WIN);
    msg={title:'Raid Repelled!', won:true, report:r, militia:militia,
         text:'Your walls held and the raiders fled. +50 gold looted from their camp. (+'+XP_BATTLE_WIN+' XP)'};
  } else {
    const loss={};
    for(const k of RES){ loss[k]=Math.floor(S.res[k]*0.08); S.res[k]-=loss[k]; }
    msg={title:'Troy Was Raided!', won:false, report:r, militia:militia, loss:loss,
         text:'Raiders broke through and plundered your stores (-8% of each resource). Raise your Walls and keep troops garrisoned!'};
  }
  scheduleNextRaid(nowMs(), false);
  checkQuests(); save();
  return msg;
}

/* ---------------- quests ---------------- */
function questState(q){
  if(S.quests[q.id]) return 'done';
  const idx = QUESTS.indexOf(q);
  if(idx>0 && !S.quests[QUESTS[idx-1].id]) return 'locked';
  return q.check() ? 'claimable' : 'active';
}
function currentQuest(){
  for(const q of QUESTS){ const st=questState(q); if(st==='active'||st==='claimable') return {q:q, st:st}; }
  return null;
}
function checkQuests(){ /* states are derived; nothing to store */ }
function claimQuest(id){
  const q = QUESTS.find(x=>x.id===id);
  if(!q || questState(q)!=='claimable') return;
  S.quests[id]=true;
  const rw=[];
  if(q.reward) for(const k of Object.keys(q.reward)){
    if(k==='heroxp'){ S.hero.xp+=q.reward[k]; rw.push(q.reward[k]+' hero XP'); }
    else { grantRes({[k]:q.reward[k]}, true); rw.push('+'+q.reward[k]+' '+RES_NAME[k]); }
  }
  addPlayerXP(XP_QUEST);
  rw.push('+'+XP_QUEST+' XP');
  if(id==='q4' && !S.raidsOn){
    S.raidsOn=true; scheduleNextRaid(nowMs(), true);
    S.shieldUntil = nowMs() + 24*60*60*1000;   // beginner shield: 24h of peace (online version: 3 days)
    setTimeout(()=>toast('🛡 Beginner shield: raiders cannot strike for 24 hours. After that, warbands come every 20–40 min — keep troops home and raise your Walls!'), 600);
  }
  if(id==='q8'){ S.victory=true; }
  toast('Quest complete: '+q.name+' — '+rw.join(', '));
  save(); render();
}

/* ---------------- daily login tribute ----------------
   Streak tracked by local calendar-day string (not timestamp). First load of a
   new day grants an escalating 7-day streak reward; missing a day resets to 1. */
const DAILY_TRIBUTE = [
  {food:150, wood:150},
  {food:200, wood:200, stone:100},
  {food:250, wood:250, stone:150, gold:100},
  {food:300, wood:300, stone:200, gold:150, xp:60},
  {food:350, wood:350, stone:250, gold:200, xp:80},
  {food:400, wood:400, stone:300, gold:250, xp:100},
  {food:500, wood:500, stone:400, gold:350, xp:150, heroxp:60}
];
function tributeDesc(rw){
  const p=[];
  for(const k of RES) if(rw[k]) p.push('+'+fmtN(rw[k])+' '+RES_NAME[k]);
  if(rw.xp) p.push('+'+rw.xp+' player XP');
  if(rw.heroxp) p.push('+'+rw.heroxp+' hero XP');
  return p.join(', ');
}
function dayString(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dailyLogin(){
  if(!S.daily) S.daily={lastDay:'', streak:0};
  const now=new Date(), today=dayString(now);
  if(S.daily.lastDay===today) return null;
  const yesterday=dayString(new Date(now.getTime()-86400000));
  S.daily.streak = (S.daily.lastDay===yesterday) ? Math.min(7, S.daily.streak+1) : 1;
  S.daily.lastDay = today;
  const rw = DAILY_TRIBUTE[S.daily.streak-1];
  const res={}; for(const k of RES) if(rw[k]) res[k]=rw[k];
  grantRes(res, true);
  if(rw.xp) addPlayerXP(rw.xp);
  if(rw.heroxp) S.hero.xp+=rw.heroxp;
  save();
  return {day:S.daily.streak, desc:tributeDesc(rw)};
}
function dailyTributeModal(d, info){
  let dots='';
  for(let i=1;i<=7;i++) dots+='<span class="sdot'+(i<=d.day?' on':'')+'">'+i+'</span>';
  let html='<div class="winbanner" style="color:var(--gold);text-shadow:0 2px 0 #000">🎁 DAILY TRIBUTE 🎁</div>'+
    '<div class="flavor">The people of Troy lay gifts at your gate.'+(d.day>=7?' The gods themselves smile upon your reign!':'')+'</div>'+
    '<div class="streak">'+dots+'</div>'+
    '<table class="rep"><tr><th>Day '+d.day+' tribute</th><td>'+esc(d.desc)+'</td></tr></table>'+
    '<div class="small center">Return tomorrow to grow the streak — miss a day and it falls back to Day 1.</div>';
  if(info && info.events.length)
    html+='<hr class="bronze"><div class="small"><b>While you were away ('+fmtT(info.elapsed)+'):</b></div>'+
          '<ul class="small">'+info.events.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>';
  html+='<br><div class="center"><button class="btn" onclick="Game.closeModal()">Accept Tribute</button></div>';
  openModal(html);
}

/* ---------------- offline progress ---------------- */
function applyOffline(){
  const elapsed = Math.min(Math.max(0,(nowMs()-S.lastSeen)/1000), 8*3600);
  const events=[];
  if(elapsed>=1){
    produce(elapsed);
    const hrs = (elapsed/3600);
    if(hrs>=0.05) events.push('+'+fmtN(prodRates().food*playerProdMult()*hrs)+' food, +'+fmtN(prodRates().wood*playerProdMult()*hrs)+' wood, +'+fmtN(prodRates().stone*playerProdMult()*hrs)+' stone, +'+fmtN(prodRates().gold*playerProdMult()*hrs)+' gold produced while away ('+fmtT(elapsed)+')');
  }
  // finish elapsed build
  if(S.build && nowMs()>=S.build.doneAt){
    const b=S.build; S.bld[b.key]=b.toLevel; S.build=null;
    addPlayerXP(XP_BUILD,true);
    events.push(BUILDINGS[b.key].name+' finished → Lv '+b.toLevel+' (+'+XP_BUILD+' XP)');
  }
  // finish elapsed training (sequential)
  let trained=0;
  while(S.tqueue.length>0){
    const b=S.tqueue[0];
    if(nowMs()<b.unitDoneAt) break;
    b.left--; b.unitDoneAt+=b.unitTime*1000;
    S.troops[b.type]=(S.troops[b.type]||0)+1; S.stats.trained++; trained++;
    addPlayerXP(XP_TRAIN,true);
    if(b.left<=0) S.tqueue.shift();
  }
  if(trained>0) events.push(trained+' troops finished training (+'+(trained*XP_TRAIN)+' XP)');
  // marches: resolve arrivals/gathers/returns silently, collect summaries
  let guard=0;
  while(guard++<20){
    let progressed=false;
    for(const m of S.marches){
      const node=NODE_BY_ID[m.nodeId];
      if(m.phase==='out' && nowMs()>=m.arriveAt){
        if(node.kind==='gather'){ m.phase='gather'; m.gatherAt=m.arriveAt+GATHER_TIME*1000; }
        else { resolveAttackMarch(m,true); events.push((m.result.won?'Victory':'Defeat')+' at '+node.name+' (+'+(m.result.won?XP_BATTLE_WIN:0)+' XP)'); }
        progressed=true;
      } else if(m.phase==='gather' && nowMs()>=m.gatherAt){
        const n=armyTotal(m.troops); m.cargo={}; m.cargo[node.res]=n*GATHER_YIELD;
        S.stats.gathers++; addPlayerXP(XP_GATHER,true);
        m.phase='back'; m.returnAt=m.gatherAt+m.marchSecs*1000; progressed=true;
      } else if(m.phase==='back' && nowMs()>=m.returnAt){
        const sv=m.survivors||m.troops;
        for(const t of TROOP_ORDER) S.troops[t]=(S.troops[t]||0)+Math.floor(sv[t]||0);
        if(m.cargo){ grantRes(m.cargo,true); events.push('Gatherers returned: +'+fmtN(m.cargo[node.res])+' '+RES_NAME[node.res]); }
        if(m.hero) S.hero.away=false;
        m.done=true; progressed=true;
      }
    }
    S.marches=S.marches.filter(m=>!m.done);
    if(!progressed) break;
  }
  // raids elapsed while away (silent, fixed factor)
  if(S.raidsOn){
    let n=0;
    while(nowMs()>=S.nextRaidAt && n<24){ tickRaid(true); n++; }
    if(n>0) events.push(n+' raid(s) struck Troy while you were away.');
  }
  checkQuests(); save();
  return {elapsed:elapsed, events:events};
}

      '<div class="prog"><div style="width:'+pct+'%"></div></div></div>';
  }
  html+='<h2 class="sec">Train Troops</h2>';
  if((S.bld.barracks||0)===0)
    html+='<div class="card"><div class="small">Build a Barracks in the city to train troops.</div></div>';
  for(const t of TROOP_ORDER){
    const T=TROOPS[t], blvl=S.bld.barracks||0, locked=blvl<T.need;
    const n=(UI.trainDraft&&UI.trainDraft[t])||10;
    const totCost={}; for(const k in T.cost) totCost[k]=T.cost[k]*n;
    html+='<div class="card"><div class="bld-head"><div class="bld-icon">'+icon(T.ic)+'</div><div>'+
      '<div class="bld-name">'+T.name+'</div>'+
      '<div class="small">ATK '+T.atk+' · DEF '+T.def+' · HP '+T.hp+' · '+T.vsText+'</div>'+
      '<div class="costline">'+costText(T.cost)+' each · '+T.time+'s each</div></div></div>';
    if(locked) html+='<div class="small">Requires Barracks Lv '+T.need+'.</div>';
    else html+='<div class="stepper"><button onclick="Game.trainAdj(\''+t+'\',-5)">−</button>'+
      '<span class="val">'+n+'</span><button onclick="Game.trainAdj(\''+t+'\',5)">+</button>'+
      '<button class="btn small" '+(canAfford(totCost)?'':'disabled')+' onclick="Game.train(\''+t+'\')">Train ('+fmtT(n*trainTime(t))+')</button></div>'+
      '<div class="costline">Batch cost: '+costText(totCost)+'</div>';
    html+='</div>';
  }
  $('#view-army').innerHTML=html;
}

function renderHero(){
  const lvl=heroLevel();
  let xp=S.hero.xp, l=1;
  while(l<lvl){ xp-=heroXpNeed(l); l++; }
  const need=heroXpNeed(lvl), pct=lvl>=HERO.maxLevel?100:Math.min(100,100*xp/need);
  let html='<h2 class="sec">Hero</h2><div class="card center"><div class="hero-portrait">'+icon('hero')+'</div>'+
    '<div class="bld-name" style="font-size:19px">Commander '+HERO.name+'</div>'+
    '<div class="bld-desc">'+HERO.title+' · Level '+lvl+'/'+HERO.maxLevel+(S.hero.away?' · <b>ON MARCH</b>':' · in Troy')+'</div>'+
    '<div class="xpbar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="small">'+(lvl>=HERO.maxLevel?'Max level':fmtN(xp)+' / '+fmtN(need)+' XP to Lv '+(lvl+1))+'</div></div>';
  html+='<div class="card"><div class="bld-name">Abilities</div>';
  for(const a of HERO_ABILITIES){
    const un=lvl>=a.lvl;
    html+='<div class="ability'+(un?' unlocked':'')+'"><div class="an">'+a.name+'</div><div class="small">'+a.desc+'</div>'+
      (un?'':'<div class="lock">Unlocks at hero level '+a.lvl+'</div>')+'</div>';
  }
  html+='</div><div class="card"><div class="small" style="font-style:italic">“I held the Bronze Gate with forty spears and a promise. Troy does not kneel — not while I draw breath.”<br><br>Theron gains XP from battles he joins and from quests. Assign him to a march from the world map to wield his abilities.</div></div>';
  $('#view-hero').innerHTML=html;
}

function renderQuests(){
  let html='<h2 class="sec">Quests</h2>';
  QUESTS.forEach((q,i)=>{
    const st=questState(q);
    let rw='';
    if(q.reward) rw=Object.keys(q.reward).map(k=>k==='heroxp'?q.reward[k]+' hero XP':'+'+q.reward[k]+' '+RES_NAME[k]).join(', ');
    html+='<div class="card qrow '+st+'"><div class="qnum">'+(st==='done'?'✓':(i+1))+'</div><div style="flex:1">'+
      '<div class="bld-name">'+esc(q.name)+'</div><div class="small">'+esc(q.desc)+'</div>'+
      (rw?'<div class="costline">Reward: '+rw+' · +'+XP_QUEST+' player XP</div>':'<div class="costline">Reward: +'+XP_QUEST+' player XP · <b>VICTORY</b></div>')+
      (st==='claimable'?'<button class="btn small" onclick="Game.claim(\''+q.id+'\')">Claim</button>':
       st==='done'?'<div class="small" style="color:#6a8f3c">Claimed</div>':
       st==='locked'?'<div class="small">Complete the previous quest first.</div>':'<div class="small">In progress…</div>')+
      '</div></div>';
  });
  $('#view-quests').innerHTML=html;
}

function render(){
  renderHeader(); renderHint(); renderTabs();
  const views=['city','map','army','hero','quests'];
  for(const v of views) $('#view-'+v).classList.toggle('active', UI.tab===v);
  if(UI.tab==='city') renderCity();
  else if(UI.tab==='map') renderMap();
  else if(UI.tab==='army') renderArmy();
  else if(UI.tab==='hero') renderHero();
  else if(UI.tab==='quests') renderQuests();
}

/* ---------------- modal & toast ---------------- */
function openModal(html){ $('#modal').innerHTML=html; $('#modal-root').classList.add('open'); }
function closeModal(){ $('#modal-root').classList.remove('open'); }
function toast(msg){
  const root=$('#toast-root');
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=msg;
  root.appendChild(el);
  while(root.children.length>3) root.firstChild.remove();
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

function openNode(id){
  const n=NODE_BY_ID[id], cleared=S.nodes[id]&&S.nodes[id].cleared;
  let body='';
  if(n.kind==='gather'){
    body='<div class="flavor">'+esc(n.flavor)+'</div>'+
      '<div class="small">Send troops to gather <b>'+RES_NAME[n.res]+'</b>: +'+GATHER_YIELD+' per troop per trip.<br>'+
      'Time on site: '+GATHER_TIME+'s · march '+fmtT(n.march)+' each way.</div><br>'+
      '<button class="btn" onclick="Game.openComposer(\''+id+'\')">Send Gatherers</button>';
  } else {
    const g=n.garrison;
    const gstr=TROOP_ORDER.filter(t=>g[t]>0).map(t=>g[t]+' '+TROOPS[t].name).join(', ');
    body='<div class="flavor">'+esc(n.flavor)+'</div>'+
      (n.tier?'<div class="small">Threat tier '+n.tier+' of 5</div>':'')+
      (n.kind==='boss'?'<div class="winbanner" style="color:var(--red)">☠ FINAL BATTLE ☠</div>':'')+
      '<div class="small" style="margin:6px 0"><b>Garrison:</b> '+esc(gstr)+(n.wallMult?' (fortified ×'+n.wallMult+')':'')+'</div>'+
      (!cleared&&n.loot?'<div class="small"><b>Loot:</b> '+Object.keys(n.loot).map(k=>'+'+fmtN(n.loot[k])+' '+RES_NAME[k]).join(', ')+'</div><br>':'')+
      (cleared?'<div class="small" style="color:#6a8f3c">'+icon('check')+' Conquered.</div>'
              :'<button class="btn red" onclick="Game.openComposer(\''+id+'\')">Attack</button>');
  }
  openModal('<h3>'+icon(nodeIcon(n))+' '+esc(n.name)+'</h3>'+body+
    '<br><button class="btn ghost small" onclick="Game.closeModal()">Close</button>');
}

function openComposer(id){
  UI.draft={nodeId:id, troops:{spearman:0,archer:0,cavalry:0}, hero:heroHome()};
  renderComposer();
}
function renderComposer(){
  const d=UI.draft; if(!d) return;
  const n=NODE_BY_ID[d.nodeId];
  let secs=n.march; if(d.hero) secs=Math.round(secs*heroMarchMult(heroLevel()));
  let html='<h3>March to '+esc(n.name)+'</h3>'+
    '<div class="small">March '+fmtT(secs)+' each way'+(d.hero&&heroLevel()>=6?' (Forced March)':'')+'. Max 2 marches at once.</div><hr class="bronze">';
  for(const t of TROOP_ORDER){
    const av=troopCount(t);
    html+='<div class="stepper"><span style="width:118px;font-size:13px">'+icon(TROOPS[t].ic)+' '+TROOPS[t].name+' <span class="small">('+av+')</span></span>'+
      '<button onclick="Game.draftAdj(\''+t+'\',-1)">−</button><span class="val">'+d.troops[t]+'</span>'+
      '<button onclick="Game.draftAdj(\''+t+'\',1)">+</button>'+
      '<button class="btn small ghost" onclick="Game.draftMax(\''+t+'\')">Max</button></div>';
  }
  const heroBtn = heroHome()||d.hero
    ? '<button class="btn small'+(d.hero?'':' ghost')+'" onclick="Game.draftHero()">'+(d.hero?'✓ ':'')+'Theron (Lv '+heroLevel()+')</button>'
    : '<button class="btn small ghost" disabled>Theron is away</button>';
  html+='<div class="stepper">'+heroBtn+'<span class="small">Hero bonuses apply only if he marches.</span></div>';
  const total=TROOP_ORDER.reduce((s,t)=>s+d.troops[t],0);
  html+='<button class="btn red" '+(total<=0?'disabled':'')+' onclick="Game.sendDraft()">Send March ('+total+')</button> '+
    '<button class="btn ghost small" onclick="Game.closeModal()">Cancel</button>';
  openModal(html);
}

function lossRow(L){
  return TROOP_ORDER.filter(t=>L[t]>0).map(t=>L[t]+' '+TROOPS[t].name).join(', ')||'none';
}
function battleReportModal(res){
  const r=res.report;
  LASTW={kind:'battle', res:res, atkLabel:'Your Army', defLabel:res.nodeName+' (Enemy)'};
  let lootHtml='';
  if(res.won && res.loot && Object.keys(res.loot).length)
    lootHtml='<tr><th>Loot</th><td>'+Object.keys(res.loot).map(k=>'+'+fmtN(res.loot[k])+' '+RES_NAME[k]).join(', ')+'</td></tr>';
  openModal('<div class="winbanner" style="color:'+(res.won?'#4a6a28':'var(--red)')+'">'+(res.won?'⚔ VICTORY ⚔':'☠ DEFEAT ☠')+'</div>'+
    '<h3 class="center">'+esc(res.nodeName)+'</h3>'+
    '<div class="small center">The battle lasted '+r.rounds+' rounds.</div>'+
    '<table class="rep"><tr><th>Your losses</th><td>'+lossRow(r.atkLost)+'</td></tr>'+
    '<tr><th>Enemy losses</th><td>'+lossRow(r.defLost)+'</td></tr>'+lootHtml+
    (res.won?'<tr><th>Rewards</th><td>+'+XP_BATTLE_WIN+' player XP'+(res.heroXp?' · +'+res.heroXp+' hero XP':'')+'</td></tr>':'')+
    '</table>'+
    (res.won?'':'<div class="small">Tip: check the enemy garrison first — bring troops that counter it (Spearmen ☞ Cavalry, Archers ☞ Spearmen, Cavalry ☞ Archers).</div><br>')+
    '<div class="center"><button class="btn" onclick="Game.watchBattle()">⚔ Watch Battle</button> '+
    '<button class="btn" onclick="Game.closeModal()">Continue</button></div>');
}
function raidModal(msg){
  const r=msg.report;
  LASTW={kind:'raid', res:msg, atkLabel:'Warband Raiders', defLabel:'Troy (Your Army)'};
  openModal('<div class="winbanner" style="color:'+(msg.won?'#4a6a28':'var(--red)')+'">'+esc(msg.title)+'</div>'+
    '<div class="flavor">'+esc(msg.text)+'</div>'+
    '<table class="rep"><tr><th>Raiders lost</th><td>'+lossRow(r.atkLost)+'</td></tr>'+
    '<tr><th>Your losses</th><td>'+lossRow(r.defLost)+'</td></tr>'+
    (msg.militia?'<tr><th>Militia (Walls)</th><td>'+msg.militia+' townsfolk fought beside your troops</td></tr>':'')+
    (msg.loss?'<tr><th>Plundered</th><td>'+Object.keys(msg.loss).filter(k=>msg.loss[k]>0).map(k=>'-'+fmtN(msg.loss[k])+' '+RES_NAME[k]).join(', ')+'</td></tr>':'')+
    '</table><div class="center"><button class="btn" onclick="Game.watchBattle()">⚔ Watch Battle</button> '+
    '<button class="btn" onclick="Game.closeModal()">Continue</button></div>');
}
/* ---------------- battle replay viewer ----------------
   Replays the per-round frames recorded by simBattle — no re-simulation,
   so the replay matches the report's outcome and losses exactly. */
const WATCH={active:false,pack:null,i:0,playing:false,speed:1,timer:null};
let LASTW=null;   // {kind:'battle'|'raid', res, atkLabel, defLabel} for the report on screen
function stopWatch(){ if(WATCH.timer){ clearInterval(WATCH.timer); WATCH.timer=null; } WATCH.playing=false; }
function watchSpeedMs(){ return WATCH.speed===4?220 : WATCH.speed===2?430 : 850; }
function wrRow(side,t){
  return '<div class="wr-row">'+icon(TROOPS[t].ic)+'<span class="wr-count" id="wr-'+side+'-'+t+'">0</span>'+
    '<div class="wr-hp"><div id="wr-'+side+'-'+t+'-bar"></div></div></div>';
}
function paintWatchFrame(f, f0){
  for(const t of TROOP_ORDER){
    $('#wr-a-'+t).textContent=Math.floor(f.a[t]);
    $('#wr-d-'+t).textContent=Math.floor(f.d[t]);
    const fa=f0.hpA>0?Math.max(0,Math.min(1,f.hpA/f0.hpA)):0;
    const fd=f0.hpD>0?Math.max(0,Math.min(1,f.hpD/f0.hpD)):0;
    $('#wr-a-'+t+'-bar').style.width=(fa*100)+'%';
    $('#wr-d-'+t+'-bar').style.width=(fd*100)+'%';
  }
  const rl=$('#wr-round'); if(rl) rl.textContent=WATCH.i;
}
function watchClash(ids){
  for(const id of ids){
    const el=$(id); if(!el) continue;
    el.classList.remove('hit','flash'); void el.offsetWidth; el.classList.add(id==='#wr-clash'?'hit':'flash');
  }
}
function watchBattleModal(pack){
  const r=pack.res.report;
  const frames=(r&&r.replay)||[];
  stopWatch();
  WATCH.active=true; WATCH.pack=pack; WATCH.i=0; WATCH.speed=1;
  if(!frames.length){
    openModal('<div class="winbanner" style="color:var(--red-d)">⚔ BATTLE REPLAY ⚔</div>'+
      '<div class="small center">No replay was recorded for this battle.</div><br>'+
      '<div class="center"><button class="btn" onclick="Game.backToReport()">Back to Report</button></div>');
    return;
  }
  const rowsA=TROOP_ORDER.map(t=>wrRow('a',t)).join('');
  const rowsD=TROOP_ORDER.map(t=>wrRow('d',t)).join('');
  openModal('<div class="winbanner" style="color:var(--red-d)">⚔ BATTLE REPLAY ⚔</div>'+
    '<div class="small center">Round <b id="wr-round">0</b> / '+r.rounds+'</div>'+
    '<div class="wr-field">'+
      '<div class="wr-side atk" id="wr-side-a"><div class="wr-name">'+esc(pack.atkLabel)+'</div>'+rowsA+'</div>'+
      '<div class="wr-mid"><div id="wr-clash">⚔️</div></div>'+
      '<div class="wr-side def" id="wr-side-d"><div class="wr-name">'+esc(pack.defLabel)+'</div>'+rowsD+'</div>'+
    '</div>'+
    '<div class="wr-controls">'+
      '<button class="btn" id="wr-play" onclick="Game.watchToggle()">▶ Play</button>'+
      '<button class="btn" id="wr-speed" onclick="Game.watchSpeed()">1×</button>'+
      '<button class="btn" onclick="Game.watchSkip()">⏩ Result</button>'+
    '</div>'+
    '<div id="wr-result"></div>'+
    '<div class="center"><button class="btn" onclick="Game.backToReport()">Back to Report</button></div>');
  paintWatchFrame(frames[0], frames[0]);
}
function watchAdvance(){
  const frames=WATCH.pack.res.report.replay;
  if(WATCH.i>=frames.length-1){ watchFinish(); return; }
  const prev=frames[WATCH.i];
  WATCH.i++;
  const cur=frames[WATCH.i];
  paintWatchFrame(cur, frames[0]);
  watchClash(['#wr-clash']);
  if(cur.hpA<prev.hpA-1e-9) watchClash(['#wr-side-a']);
  if(cur.hpD<prev.hpD-1e-9) watchClash(['#wr-side-d']);
}
function watchFinish(){
  const frames=WATCH.pack.res.report.replay;
  WATCH.i=frames.length-1;
  paintWatchFrame(frames[WATCH.i], frames[0]);
  stopWatch();
  const pb=$('#wr-play'); if(pb) pb.textContent='▶ Play';
  const won=WATCH.pack.res.won;
  const rr=$('#wr-result');
  if(rr) rr.innerHTML='<div style="color:'+(won?'#4a6a28':'var(--red)')+';font-size:17px;letter-spacing:1px">'+(won?'⚔ VICTORY ⚔':'☠ DEFEAT ☠')+'</div>'+
    '<div class="small">Final losses match the battle report exactly.</div>';
}
function watchToggle(){
  const frames=WATCH.pack.res.report.replay;
  const pb=$('#wr-play');
  if(WATCH.playing){ stopWatch(); if(pb) pb.textContent='▶ Play'; return; }
  if(WATCH.i>=frames.length-1){ WATCH.i=0; paintWatchFrame(frames[0],frames[0]); const rr=$('#wr-result'); if(rr) rr.innerHTML=''; }
  WATCH.playing=true; if(pb) pb.textContent='⏸ Pause';
  WATCH.timer=setInterval(watchAdvance, watchSpeedMs());
}
function watchSpeedCycle(){
  WATCH.speed = WATCH.speed===1?2 : WATCH.speed===2?4 : 1;
  const sb=$('#wr-speed'); if(sb) sb.textContent=WATCH.speed+'×';
  if(WATCH.playing){ clearInterval(WATCH.timer); WATCH.timer=setInterval(watchAdvance, watchSpeedMs()); }
}
function backToReport(){
  stopWatch(); WATCH.active=false;
  const p=LASTW; if(!p){ closeModal(); return; }
  if(p.kind==='raid') raidModal(p.res); else battleReportModal(p.res);
}
function welcomeModal(){
  openModal('<div class="winbanner" style="color:var(--red-d)">TROY</div>'+
    '<div class="flavor">The old city is dust and song. The gods have gone quiet. But on a hill above the wine-dark sea, one commander still believes a city can rise again — yours.</div>'+
    '<div class="small">You are <b>Theron, Warden of the Bronze Gate</b>, and the scattered people look to you. Build Troy. Raise an army. Break Warlord Skaros.<br><br>Follow the quests at the top of the city view — they will teach you building, gathering, training, and war.</div><br>'+
    '<div class="center"><button class="btn" onclick="Game.closeModal()">⚔ Raise the Banner</button></div>');
}
function victoryModal(){
  const days=((nowMs()-S.createdAt)/86400000);
  openModal('<div class="winbanner" style="color:var(--gold);text-shadow:0 2px 0 #000">🏛 TRIUMPH 🏛</div>'+
    '<div class="flavor">Skaros the Render lies broken before the Bronze Gate. From the hills to the sea, every banner now bows toward one city — <b>Troy</b>. The bards will sing of Theron for a thousand years, and the wine will flow tonight.</div>'+
    '<table class="rep"><tr><th>Days ruled</th><td>'+days.toFixed(1)+'</td></tr>'+
    '<tr><th>Player level</th><td>Lv '+S.player.level+'</td></tr>'+
    '<tr><th>Troops trained</th><td>'+fmtN(S.stats.trained)+'</td></tr>'+
    '<tr><th>Battles won</th><td>'+S.stats.wins+' of '+S.stats.battles+'</td></tr>'+
    '<tr><th>Raids repelled</th><td>'+S.stats.raidsRepelled+'</td></tr></table>'+
    '<div class="center"><button class="btn" onclick="Game.closeModal()">Rule On (sandbox)</button></div>');
}
function awayModal(info){
  openModal('<h3>While you were away…</h3><div class="small">Gone '+fmtT(info.elapsed)+' — your city kept working (up to 8h).</div><hr class="bronze">'+
    (info.events.length?'<ul class="small">'+info.events.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':'<div class="small">All quiet on the walls.</div>')+
    '<br><div class="center"><button class="btn" onclick="Game.closeModal()">Continue</button></div>');
}

/* ---------------- public API (inline onclick handlers) ---------------- */
const Game={
  tab(t){ UI.tab=t; render(); },
  build(key){ startBuild(key); },
  trainAdj(t,d){ UI.trainDraft=UI.trainDraft||{spearman:10,archer:10,cavalry:10};
    UI.trainDraft[t]=Math.max(5,Math.min(50,(UI.trainDraft[t]||10)+d)); render(); },
  train(t){ const n=(UI.trainDraft&&UI.trainDraft[t])||10; queueTrain(t,n); },
  openNode(id){ openNode(id); },
  openComposer(id){ openComposer(id); },
  draftAdj(t,d){ const dr=UI.draft; if(!dr) return;
    dr.troops[t]=Math.max(0,Math.min(troopCount(t),dr.troops[t]+d)); renderComposer(); },
  draftMax(t){ if(UI.draft){ UI.draft.troops[t]=troopCount(t); renderComposer(); } },
  draftHero(){ if(UI.draft&&(heroHome()||UI.draft.hero)){ UI.draft.hero=!UI.draft.hero; renderComposer(); } },
  sendDraft(){ const d=UI.draft; if(d) sendMarch(d.nodeId,d.troops,d.hero); },
  claim(id){ claimQuest(id); },
  watchBattle(){ if(LASTW) watchBattleModal(LASTW); },
  watchToggle(){ watchToggle(); },
  watchSpeed(){ watchSpeedCycle(); },
  watchSkip(){ watchSkip(); },
  backToReport(){ backToReport(); },
  closeModal(){ closeModal(); },
  enterTitle(){ const t=$('#titlescreen'); if(t) t.style.display='none'; }
};
window.Game=Game;

/* ---------------- main loop & init ---------------- */
let saveCounter=0;
function tick(){
  if(!S) return;
  produce(1);
  if(S.build && nowMs()>=S.build.doneAt) completeBuild();
  tickTraining();
  const reports=tickMarches(false);
  if(reports.length){
    for(let i=0;i<reports.length-1;i++) toast((reports[i].won?'Victory':'Defeat')+' at '+reports[i].nodeName);
    battleReportModal(reports[reports.length-1]);
  }
  const raidMsg=tickRaid(false);
  if(raidMsg && !raidMsg.warn) raidModal(raidMsg);
  if(S.victory && !S.victoryShown){ S.victoryShown=true; victoryModal(); save(); }
  if(++saveCounter>=5){ saveCounter=0; save(); }
  render();
}
function init(){
  const loaded=load();
  S = loaded || defaultState();
  UI.trainDraft={spearman:10,archer:10,cavalry:10};
  if(!loaded){
    const d0=dailyLogin();           // Day-1 tribute for a new reign
    save(); render();
    S.seenWelcome=true; save();
    welcomeModal();
    if(d0) setTimeout(()=>toast('🎁 Daily Tribute (Day 1) claimed: '+esc(d0.desc)), 900);
  } else {
    const info=applyOffline();
    render();
    const d=dailyLogin();
    if(d) dailyTributeModal(d, info);
    else if(info.events.length>0) awayModal(info);
  }
  setInterval(tick,1000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
  $('#modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root'){ if(WATCH.active) backToReport(); else closeModal(); } });
}
document.addEventListener('DOMContentLoaded', init);
</script>
